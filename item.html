<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lityen 🔥 Item Page</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ece4fb; --card: #ffffff;
  --lavender: #b9a3ee; --lavender-dark: #9b7fe0;
  --mint: #8fe0d8; --mint-dark: #5fc9bd;
  --ink: #221c33; --ink-soft: #6b6180;
  --border: rgba(34,28,51,0.10); --border-strong: rgba(34,28,51,0.22);
  --danger: #ff6b8a; --success: #4ecdb0;
  --header-bg: rgba(244,238,253,0.9);
  --dot-color: rgba(155,127,224,0.18);
}
html[data-theme="dark"] {
  --bg: #1b1530; --card: #241c3d;
  --lavender: #b9a3ee; --lavender-dark: #c3aef5;
  --mint: #8fe0d8; --mint-dark: #7fe8dc;
  --ink: #f2eefd; --ink-soft: #b3a6d1;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.22);
  --danger: #ff6b8a; --success: #4ecdb0;
  --header-bg: rgba(27,21,48,0.9);
  --dot-color: rgba(185,163,238,0.14);
}
body, .header, .main-img-wrap, .info-notes, .sec-link, .qc-thumb { transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
.theme-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 100px;
  border: 2px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 0.95rem; transition: border-color 0.2s;
}
.theme-toggle:hover { border-color: var(--lavender-dark); }

body {
  font-family: 'Quicksand', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
  background-size: 26px 26px;
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg); backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; height: 58px;
}
.logo { font-family: 'Fredoka', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--ink); text-decoration: none; }
.header-right { display: flex; align-items: center; gap: 0.75rem; }
.back-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.78rem; font-weight: 700;
  padding: 0.4rem 1rem; border-radius: 100px;
  border: 2px solid var(--border); background: var(--card);
  color: var(--ink-soft); text-decoration: none;
  transition: all 0.15s;
}
.back-btn:hover { border-color: var(--lavender-dark); color: var(--lavender-dark); }

/* HERO */
.hero {
  display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
  max-width: 1020px; margin: 0 auto; padding: 2.5rem 1.75rem;
  position: relative; z-index: 1; align-items: start;
}

.main-img-wrap {
  border-radius: 22px; overflow: hidden; aspect-ratio: 3/4;
  background: var(--card); border: 2px solid var(--border);
  position: relative;
}
.main-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.main-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
.badge-new {
  position: absolute; top: 0.75rem; left: 0.75rem;
  font-size: 0.6rem; font-weight: 700; padding: 0.22rem 0.65rem;
  border-radius: 100px; background: var(--mint); color: var(--ink);
  font-family: 'Quicksand', sans-serif;
}
.badge-seen {
  position: absolute; top: 0.75rem; right: 0.75rem;
  font-size: 0.7rem; padding: 0.16rem 0.5rem;
  border-radius: 100px; background: var(--ink); color: #fff;
}

.info { display: flex; flex-direction: column; gap: 1rem; padding-top: 0.5rem; }
.info-cat { font-size: 0.7rem; color: var(--ink-soft); font-weight: 700; letter-spacing: 0.03em; }
.info-name { font-family: 'Fredoka', sans-serif; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; line-height: 1.1; }
.info-price { font-family: 'Fredoka', sans-serif; font-size: 1.7rem; font-weight: 600; color: var(--lavender-dark); }
.info-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.info-tag { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.6rem; border-radius: 100px; background: var(--bg); color: var(--ink-soft); }
.info-notes {
  font-size: 0.85rem; color: var(--ink-soft); font-weight: 500; line-height: 1.7;
  background: var(--card); border: 2px solid var(--border);
  border-radius: 16px; padding: 0.9rem 1rem;
}
.info-links { display: flex; flex-direction: column; gap: 0.6rem; }

.litbuy-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  font-family: 'Quicksand', sans-serif; font-size: 0.88rem; font-weight: 700;
  padding: 0.75rem 1.5rem; border-radius: 16px;
  background: var(--ink); color: #fff;
  text-decoration: none; transition: opacity 0.2s;
}
.litbuy-btn:hover { opacity: 0.85; }
.litbuy-btn img { width: 16px; height: 16px; border-radius: 3px; }

.sec-links { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.sec-link {
  font-size: 0.75rem; font-weight: 700;
  padding: 0.38rem 0.9rem; border-radius: 100px;
  border: 2px solid var(--border); background: var(--card); color: var(--ink-soft);
  text-decoration: none; transition: all 0.15s;
}
.sec-link:hover { border-color: var(--lavender-dark); color: var(--lavender-dark); }
.sec-link.weidian { border-color: rgba(255,107,138,0.35); color: var(--danger); }
.sec-link.weidian:hover { background: #ffeef1; }

/* QC SECTION */
.qc-section { max-width: 1020px; margin: 0 auto; padding: 0 1.75rem 4rem; position: relative; z-index: 1; }
.qc-divider { height: 2px; background: var(--border); margin-bottom: 1.5rem; border-radius: 2px; }
.qc-title {
  font-family: 'Fredoka', sans-serif; font-size: 1.3rem; font-weight: 600;
  margin-bottom: 1rem; color: var(--ink); display: flex; align-items: center; gap: 0.5rem;
}
.qc-count { font-family: 'Quicksand', sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); }

.qc-row { display: flex; gap: 0.6rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.5rem; }
.qc-row::-webkit-scrollbar { display: none; }
.qc-thumb {
  width: 120px; height: 120px; border-radius: 14px; overflow: hidden;
  flex-shrink: 0; cursor: pointer; border: 2px solid var(--border);
  transition: all 0.2s; background: var(--card);
}
.qc-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
.qc-thumb:hover { border-color: var(--lavender-dark); }
.qc-thumb:hover img { transform: scale(1.05); }

/* LIGHTBOX */
.lightbox {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(34,28,51,0.85);
  align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 16px; user-select: none; }
.lightbox-close {
  position: absolute; top: 1.25rem; right: 1.5rem;
  font-size: 1.4rem; color: rgba(255,255,255,0.7); cursor: pointer;
  transition: color 0.2s; line-height: 1; background: none; border: none;
}
.lightbox-close:hover { color: #fff; }
.lightbox-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; background: rgba(255,255,255,0.15);
  border: none; border-radius: 100px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s; font-size: 1.1rem; user-select: none;
}
.lightbox-arrow:hover { background: rgba(255,255,255,0.28); }
.lightbox-prev { left: 1.25rem; }
.lightbox-next { right: 1.25rem; }
.lightbox-counter {
  position: absolute; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
  font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.6);
}

.loading-state {
  display: flex; flex-direction: column; align-items: center;
  gap: 0.75rem; padding: 6rem; color: var(--ink-soft); font-size: 0.85rem; font-weight: 600;
}
.spinner {
  width: 20px; height: 20px;
  border: 3px solid var(--border); border-top-color: var(--lavender-dark);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.not-found { text-align: center; padding: 6rem 1rem; color: var(--ink-soft); }
.not-found p { margin-bottom: 1.5rem; font-weight: 600; }
.not-found a {
  font-size: 0.82rem; font-weight: 700; color: var(--ink-soft);
  border: 2px solid var(--border); padding: 0.5rem 1.2rem;
  border-radius: 100px; text-decoration: none; transition: all 0.15s; background: var(--card);
}
.not-found a:hover { border-color: var(--lavender-dark); color: var(--lavender-dark); }

@media (max-width: 680px) {
  .hero { grid-template-columns: 1fr; gap: 1.5rem; padding: 1.5rem 1rem; }
  .qc-section { padding: 0 1rem 3rem; }
  .header { padding: 0 1rem; }
  .qc-thumb { width: 90px; height: 90px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">lityen 🔥</a>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    <a href="catalog.html" class="back-btn">← Back to catalog</a>
  </div>
</header>

<div id="itemContent">
  <div class="loading-state" style="position:relative;z-index:1">
    <div class="spinner"></div>
    <span>loading...</span>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-arrow lightbox-prev" onclick="lightboxNav(-1)">‹</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-arrow lightbox-next" onclick="lightboxNav(1)">›</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBo-hOtlG2aptuJ71LCoAd1BgVUINg3uvE",
  authDomain: "lityenn.firebaseapp.com",
  projectId: "lityenn",
  storageBucket: "lityenn.firebasestorage.app",
  messagingSenderId: "1074230941679",
  appId: "1:1074230941679:web:03091885d3e62d4b0a881a"
});
const db = getFirestore(app);
const id = new URLSearchParams(location.search).get('id');

let qcImages = [];
let lightboxIndex = 0;

async function load() {
  if (!id) { notFound(); return; }
  try {
    const snap = await getDoc(doc(db, 'items', id));
    if (!snap.exists()) { notFound(); return; }
    const item = { id: snap.id, ...snap.data() };
    document.title = `lityen — ${item.name}`;
    render(item);
  } catch(e) { notFound(); }
}

function notFound() {
  document.getElementById('itemContent').innerHTML = `
    <div class="not-found">
      <p>Item not found.</p>
      <a href="catalog.html">← back to catalog</a>
    </div>`;
}

function render(item) {
  qcImages = (item.qc || []).filter(Boolean);

  document.getElementById('itemContent').innerHTML = `
    <div class="hero">
      <div class="main-img-wrap">
        ${item.img
          ? `<img src="${item.img}" alt="${item.name}" id="mainImg">`
          : `<div class="main-img-placeholder">📦</div>`}
        ${item.isNew ? `<span class="badge-new">new</span>` : ''}
        ${item.seenOnVideo ? `<span class="badge-seen">🎬</span>` : ''}
      </div>

      <div class="info">
        <div class="info-cat">${item.category || ''}</div>
        <h1 class="info-name">${item.name}</h1>
        <div class="info-price">${item.price || ''}</div>
        ${(item.tags || []).length
          ? `<div class="info-tags">${item.tags.map(t => `<span class="info-tag">${t}</span>`).join('')}</div>`
          : ''}
        ${item.notes
          ? `<div class="info-notes" style="white-space:pre-wrap">${item.notes}</div>`
          : ''}
        <div class="info-links">
          ${item.litbuy ? `
            <a class="litbuy-btn" href="${item.litbuy}" target="_blank" rel="noopener">
              <img src="https://www.google.com/s2/favicons?domain=litbuy.com&sz=32" alt="">
              Buy on Litbuy
            </a>` : ''}
          <div class="sec-links">
            ${item.weidian ? `<a class="sec-link weidian" href="${item.weidian}" target="_blank" rel="noopener">Weidian ↗</a>` : ''}
            ${item.taobao  ? `<a class="sec-link" href="${item.taobao}" target="_blank" rel="noopener">Taobao ↗</a>` : ''}
            ${item._1688   ? `<a class="sec-link" href="${item._1688}" target="_blank" rel="noopener">1688 ↗</a>` : ''}
          </div>
        </div>
      </div>
    </div>

    ${qcImages.length ? `
    <div class="qc-section">
      <div class="qc-divider"></div>
      <div class="qc-title">
        QC Pics
        <span class="qc-count">${qcImages.length} photo${qcImages.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="qc-row">
        ${qcImages.map((url, i) => `
          <div class="qc-thumb" onclick="openLightbox(${i})">
            <img src="${url}" alt="QC ${i+1}" loading="lazy">
          </div>
        `).join('')}
      </div>
    </div>` : ''}
  `;
}

window.openLightbox = (i) => {
  lightboxIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
};
window.closeLightbox = () => {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
};
window.lightboxNav = (dir) => {
  lightboxIndex = (lightboxIndex + dir + qcImages.length) % qcImages.length;
  updateLightbox();
};
function updateLightbox() {
  document.getElementById('lightboxImg').src = qcImages[lightboxIndex];
  document.getElementById('lightboxCounter').textContent = `${lightboxIndex + 1} / ${qcImages.length}`;
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') window.lightboxNav(1);
  if (e.key === 'ArrowLeft')  window.lightboxNav(-1);
  if (e.key === 'Escape')     window.closeLightbox();
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) window.closeLightbox();
});

load();

(function() {
  const saved = localStorage.getItem('lityen-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lityen-theme', next);
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
  });
})();
</script>
</body>
</html>
