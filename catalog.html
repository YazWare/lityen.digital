<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lityen 🔥 — Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ece4fb; --card: #ffffff;
  --lavender: #b9a3ee; --lavender-dark: #9b7fe0;
  --mint: #8fe0d8; --mint-dark: #5fc9bd;
  --ink: #221c33; --ink-soft: #6b6180;
  --border: rgba(34,28,51,0.10); --border-strong: rgba(34,28,51,0.22);
  --header-bg: rgba(244,238,253,0.9);
  --dot-color: rgba(155,127,224,0.18);
}
html[data-theme="dark"] {
  --bg: #1b1530; --card: #241c3d;
  --lavender: #b9a3ee; --lavender-dark: #c3aef5;
  --mint: #8fe0d8; --mint-dark: #7fe8dc;
  --ink: #f2eefd; --ink-soft: #b3a6d1;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.22);
  --header-bg: rgba(27,21,48,0.9);
  --dot-color: rgba(185,163,238,0.14);
}
body, .header, .filter-bar, .card { transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
.theme-toggle {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 100px;
  border: 2px solid var(--border); background: var(--card);
  cursor: pointer; font-size: 0.95rem; transition: border-color 0.2s;
}
.theme-toggle:hover { border-color: var(--lavender-dark); }

body {
  font-family: 'Quicksand', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(var(--dot-color) 1.5px, transparent 1.5px);
  background-size: 26px 26px;
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header-bg); backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; height: 58px;
}
.logo { font-family: 'Fredoka', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--ink); text-decoration: none; }

/* FILTER BAR */
.filter-bar {
  position: sticky; top: 58px; z-index: 90;
  background: var(--header-bg); backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--border);
  padding: 0.65rem 1.5rem;
  display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
}

.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; width: 13px; height: 13px; }
.search-input {
  background: var(--card); border: 2px solid var(--border);
  border-radius: 100px; color: var(--ink);
  font-family: 'Quicksand', sans-serif; font-size: 0.8rem; font-weight: 600;
  padding: 0.45rem 0.85rem 0.45rem 2.1rem; outline: none; width: 220px;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--lavender-dark); }
.search-input::placeholder { color: var(--ink-soft); font-weight: 500; }

.tab {
  font-family: 'Quicksand', sans-serif; font-size: 0.75rem; font-weight: 700;
  padding: 0.32rem 0.85rem; border-radius: 100px;
  border: 2px solid transparent; background: var(--card); color: var(--ink-soft);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.tab:hover { border-color: var(--border-strong); }
.tab.active { background: var(--lavender-dark); color: #fff; }

.seen-btn {
  font-family: 'Quicksand', sans-serif; font-size: 0.75rem; font-weight: 700;
  padding: 0.32rem 0.85rem; border-radius: 100px;
  border: 2px solid var(--border); background: var(--card); color: var(--ink-soft);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.seen-btn:hover { border-color: var(--border-strong); }
.seen-btn.active { background: var(--mint); border-color: var(--mint-dark); color: var(--ink); }

.count { font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); margin-left: auto; }

/* GRID */
.main { padding: 1.25rem 1.5rem 4rem; position: relative; z-index: 1; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 200px));
  gap: 14px;
}

/* CARD */
.card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s;
}
.card:hover {
  border-color: var(--lavender-dark);
  transform: translateY(-4px);
  box-shadow: 0 12px 26px rgba(155,127,224,0.22);
}

.card-img {
  display: block; width: 100%; height: 200px;
  object-fit: cover; background: var(--bg);
  transition: transform 0.35s;
}
.card:hover .card-img { transform: scale(1.05); }
.card-no-img {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 200px; background: var(--bg);
  font-size: 2.5rem; color: var(--ink-soft);
}

.card-info { padding: 0.7rem 0.75rem 0.75rem; }
.card-name {
  font-family: 'Quicksand', sans-serif;
  font-size: 0.78rem; font-weight: 700; line-height: 1.3;
  color: var(--ink); margin-bottom: 0.2rem;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card-price {
  font-family: 'Fredoka', sans-serif;
  font-size: 0.95rem; font-weight: 600; color: var(--lavender-dark);
  margin-bottom: 0.55rem;
}
.card-buy {
  display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  width: 100%; padding: 0.45rem;
  border-radius: 100px;
  background: var(--ink); color: #fff;
  font-family: 'Quicksand', sans-serif; font-size: 0.7rem; font-weight: 700;
  text-decoration: none; transition: opacity 0.2s;
}
.card-buy:hover { opacity: 0.85; }
.card-buy.no-link { opacity: 0.3; pointer-events: none; }
.card-buy img { width: 11px; height: 11px; border-radius: 2px; }

/* badges */
.badge-new {
  position: absolute; top: 0.5rem; left: 0.5rem; z-index: 2;
  font-size: 0.58rem; font-weight: 700;
  padding: 0.18rem 0.55rem; border-radius: 100px;
  background: var(--mint); color: var(--ink);
  font-family: 'Quicksand', sans-serif;
}
.badge-seen {
  position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2;
  font-size: 0.65rem; padding: 0.14rem 0.42rem;
  border-radius: 100px; background: var(--ink); color: #fff;
}

/* loading */
.loading {
  grid-column: 1/-1;
  display: flex; flex-direction: column; align-items: center;
  gap: 0.75rem; padding: 5rem; color: var(--ink-soft); font-size: 0.85rem; font-weight: 600;
}
.spinner {
  width: 22px; height: 22px;
  border: 3px solid var(--border); border-top-color: var(--lavender-dark);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.card { animation: fadeUp 0.3s ease both; }

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card-img, .card-no-img { height: 170px; }
  .main { padding: 1rem; }
  .filter-bar, .header { padding-left: 1rem; padding-right: 1rem; }
  .search-input { width: 160px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">lityen 🔥</a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
</header>

<div class="filter-bar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Search...">
  </div>
  <div id="tabs" style="display:flex;gap:0.3rem;overflow-x:auto;scrollbar-width:none"></div>
  <button class="seen-btn" id="seenBtn">🎬 Seen on video</button>
  <span class="count" id="count"></span>
</div>

<main class="main">
  <div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div><span>loading...</span></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBo-hOtlG2aptuJ71LCoAd1BgVUINg3uvE",
  authDomain: "lityenn.firebaseapp.com",
  projectId: "lityenn",
  storageBucket: "lityenn.firebasestorage.app",
  messagingSenderId: "1074230941679",
  appId: "1:1074230941679:web:03091885d3e62d4b0a881a"
});
const db = getFirestore(app);

let items = [], cat = 'All', seenOnly = false;

async function load() {
  try {
    const snap = await getDocs(query(collection(db, 'items'), orderBy('createdAt', 'desc')));
    items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTabs(); render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="loading" style="color:#ff6b8a">Failed — check Firestore rules.</div>`;
  }
}

function filtered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return items.filter(i => {
    if (cat !== 'All' && i.category !== cat) return false;
    if (seenOnly && !i.seenOnVideo) return false;
    if (q && ![ i.name, i.category, ...(i.tags||[]), i.notes ].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderTabs() {
  const cats = ['All', ...new Set(items.map(i => i.category).filter(Boolean))];
  document.getElementById('tabs').innerHTML = cats.map(c =>
    `<button class="tab${c===cat?' active':''}" onclick="setcat('${c}')">${c}</button>`
  ).join('');
}

function render() {
  const list = filtered();
  document.getElementById('count').textContent = `${list.length} item${list.length!==1?'s':''}`;
  const grid = document.getElementById('grid');

  const telegramCard = `
    <a class="card" href="https://t.me/+pKPp6b0j76s4ZDcx" target="_blank" rel="noopener" style="text-decoration:none;cursor:pointer">
      <div class="card-img" style="display:flex;align-items:center;justify-content:center;background:var(--lavender);font-size:3rem">💬</div>
      <div class="card-info">
        <div class="card-name" style="color:var(--lavender-dark)">RN Finds Channel</div>
        <div class="card-price" style="font-size:0.72rem;font-family:'Quicksand',sans-serif;font-weight:700;color:var(--lavender-dark)">Best Telegram for reps 🔥</div>
        <span class="card-buy" style="background:var(--lavender-dark)">Join channel ↗</span>
      </div>
    </a>`;

  if (!list.length) {
    grid.innerHTML = telegramCard + `<div class="loading" style="grid-column:span 1">no items found.</div>`;
    return;
  }
  grid.innerHTML = telegramCard + list.map((item, i) => `
    <div class="card" onclick="location.href='item.html?id=${item.id}'" style="animation-delay:${i*0.04}s">
      ${item.isNew ? `<span class="badge-new">new</span>` : ''}
      ${item.seenOnVideo ? `<span class="badge-seen">🎬</span>` : ''}
      ${item.img
        ? `<img class="card-img" src="${item.img}" alt="${item.name}" loading="lazy">`
        : `<div class="card-no-img">📦</div>`}
      <div class="card-info">
        <div class="card-name">${item.name}</div>
        <div class="card-price">${item.price || ''}</div>
        ${item.litbuy
          ? `<a class="card-buy" href="${item.litbuy}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
               <img src="https://www.google.com/s2/favicons?domain=litbuy.com&sz=16" style="width:13px;height:13px;border-radius:2px">
               Buy on Litbuy
             </a>`
          : `<span class="card-buy no-link">No Litbuy link</span>`}
      </div>
    </div>
  `).join('');
}

window.setcat = c => { cat = c; renderTabs(); render(); };
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('seenBtn').addEventListener('click', () => {
  seenOnly = !seenOnly;
  document.getElementById('seenBtn').classList.toggle('active', seenOnly);
  render();
});

load();

(function() {
  const saved = localStorage.getItem('lityen-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('lityen-theme', next);
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
  });
})();
</script>
</body>
</html>
